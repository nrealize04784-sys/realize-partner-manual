<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>REALIZE CLUB 総合マニュアル</title></head>
<body>
<p style="font-family:sans-serif;padding:24px">REALIZE CLUB 総合マニュアルを読み込んでいます...</p>
<script>
(async () => {
  const response = await fetch('./manual-base.html', {cache:'no-cache'});
  if (!response.ok) throw new Error('Load failed '+response.status);
  const source = new DOMParser().parseFromString(await response.text(), 'text/html');
  source.querySelectorAll('#market .note').forEach(note => {
    if (note.textContent.includes('お買い物画面の確認')) note.remove();
  });
  const output = '<!DOCTYPE html>\n' + source.documentElement.outerHTML;
  document.open(); document.write(output); document.close();
})().catch(err => {
  console.error(err);
  document.body.textContent='マニュアルを読み込めませんでした。ページを再読み込みしてください。';
});
</script>
</body></html>
